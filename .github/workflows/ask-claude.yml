# Answers messages from the Planner phone app's chat (see worker/PROTOCOL.md).
# The phone starts this with a workflow_dispatch right after leaving a message in Dropbox.
# Runs Claude Code with Jordan's Claude subscription (CLAUDE_CODE_OAUTH_TOKEN, from
# `claude setup-token`), never the paid API.
name: Ask Claude

on:
  workflow_dispatch:
    inputs:
      request:
        description: "Request id (informational; the job answers every pending message)"
        required: false

concurrency:
  group: ask-claude          # one at a time; a queued run picks up anything still pending
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  answer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Answer pending messages
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          WORKER_NAME: github
          TZ: America/Chicago
        run: python3 worker/run.py
